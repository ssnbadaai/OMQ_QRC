<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1220" />
  <meta name="robots" content="noindex" />
  <title>Sign in — OMQ Tools</title>
  <link rel="icon" href="IMG/omq-logo.png" />
  <link rel="apple-touch-icon" href="IMG/omq-logo.png" />
  <link rel="stylesheet" href="styles.css?v=10" />
</head>
<body>

  <header class="topbar">
    <a class="brand" href="index.html">
      <img src="IMG/omq-logo.png" alt="OMQ" class="brand-logo" />
      <span class="brand-name">OMQ <b>Tools</b></span>
    </a>
  </header>

  <main class="login-wrap">
    <section class="panel login-card">
      <img src="IMG/omq-logo.png" alt="" class="login-mark" />

      <h1>Sign in</h1>
      <p class="muted-copy">
        One account for every OMQ tool. Continue with your
        <b id="domainName">omqpro.com</b> Google account — there is no password
        to keep, and access follows the account.
      </p>

      <div class="google-slot" id="googleBtn"></div>
      <p class="status" id="loginStatus"></p>

      <p class="login-back">
        <a href="index.html">← Back to OMQ Tools</a>
      </p>
    </section>
  </main>

  <footer class="footer">OMQ</footer>

  <script src="api.js?v=10"></script>
  <script src="login.js?v=10"></script>
</body>
</html>
