<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1220" />
  <meta name="robots" content="noindex" />
  <title>OMQ Email Cards</title>
  <link rel="icon" href="IMG/omq-logo.png" />
  <link rel="apple-touch-icon" href="IMG/omq-logo.png" />
  <link rel="stylesheet" href="styles.css?v=11" />
</head>
<body>

  <header class="topbar">
    <a class="brand" href="dev.html">
      <img src="IMG/omq-logo.png" alt="OMQ" class="brand-logo" />
      <span class="brand-name">OMQ <b>Email Cards</b></span>
    </a>
    <div class="topbar-right">
      <span class="account" id="authAccount"></span>
      <a class="topbar-link" href="dev.html">Dev Tools →</a>
    </div>
  </header>

  <main class="card-layout">

    <!-- ============ PREVIEW ============ -->
    <section class="panel card-preview-panel">
      <div class="admin-header">
        <h2>Preview</h2>
        <div class="device-toggle" id="deviceToggle">
          <button class="tab active" data-device="desktop">Desktop</button>
          <button class="tab" data-device="phone">Phone</button>
        </div>
      </div>

      <div class="card-stage" id="cardStage">
        <iframe id="cardFrame" title="Email preview"></iframe>
      </div>

      <div class="actions">
        <button id="copyRichBtn">Copy for email</button>
        <button id="copyHtmlBtn" class="secondary">Copy HTML</button>
        <button id="downloadBtn" class="secondary">.html</button>
      </div>
      <p class="status" id="exportStatus">
        <b>Copy for email</b> then paste into Gmail or Outlook — it arrives as a
        real card, not a picture.
      </p>
    </section>

    <!-- ============ CONTENT ============ -->
    <section class="panel">
      <h2>Content</h2>

      <div class="field-row">
        <label>Template
          <select id="templateSelect"></select>
        </label>
        <label>Language
          <select id="langSelect">
            <option value="en" selected>English — left to right</option>
            <option value="ar">العربية — right to left</option>
          </select>
        </label>
      </div>

      <div id="fields"></div>
    </section>

    <!-- ============ DESIGN ============ -->
    <section class="panel">
      <h2>Design</h2>

      <h3>Photo</h3>
      <label class="file-label">
        <input type="file" id="photoInput" accept="image/*" />
        <span id="photoText">Choose a photo</span>
      </label>
      <label>…or paste an image address
        <input type="url" id="photoUrl" placeholder="https://…/photo.jpg"
               autocapitalize="off" autocorrect="off" spellcheck="false" />
      </label>
      <p class="status" id="photoStatus"></p>

      <h3>Colours</h3>
      <div class="field-row">
        <label>Accent
          <input type="color" id="accentColor" value="#24a8ac" />
        </label>
        <label>Header
          <input type="color" id="darkColor" value="#141414" />
        </label>
        <label>Card
          <input type="color" id="paperColor" value="#ffffff" />
        </label>
        <label>Page
          <input type="color" id="pageColor" value="#f2f3f7" />
        </label>
      </div>
      <p class="muted-copy hidden" id="brandColours"></p>

      <h3>Type</h3>
      <div class="field-row">
        <label>Font
          <select id="fontFamily">
            <option value="serif" selected>Serif — Georgia</option>
            <option value="sans">Sans — Arial / Helvetica</option>
          </select>
        </label>
        <label>Falls back to
          <select id="fontFallback">
            <option value="serif" selected>Serif — Georgia</option>
            <option value="sans">Sans — Arial / Helvetica</option>
          </select>
        </label>
      </div>
      <div class="field-row">
        <label>Heading size
          <input type="range" id="headingSize" min="22" max="46" step="1" value="34" />
          <span class="range-val" id="headingSizeVal">34 px</span>
        </label>
      </div>

      <p class="muted-copy" id="fontNote"></p>

      <h3>Elements</h3>
      <label class="checkbox-label">
        <input type="checkbox" id="showLogo" checked /> OMQ logo, centre
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="showWave" checked /> Wave, trailing corner
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="showRule" /> Accent rule above the footer
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="roundCard" checked /> Rounded corners
      </label>

      <label>Side artwork <span class="opt">leading corner</span>
        <input type="url" id="badgeUrl" value="IMG/Asma_meme512.png"
               autocapitalize="off" autocorrect="off" spellcheck="false" />
      </label>

      <p class="status" id="artStatus"></p>
    </section>
  </main>

  <footer class="footer">
    OMQ Email Cards · <a href="dev.html">Dev Tools</a> · <a href="index.html">Home</a>
  </footer>

  <script src="api.js?v=11"></script>
  <script src="card.js?v=11"></script>
</body>
</html>
