<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0f1220" />
  <title>Redirecting…</title>
  <link rel="icon" href="/IMG/omq-logo.png" />
  <!-- Styles are inline so the redirect is not delayed by a stylesheet request. -->
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 80% -10%, #232a55 0%, #0f1220 55%);
      color: #eef0fa;
      text-align: center;
    }
    .card { max-width: 420px; width: 100%; }
    .logo { height: 56px; width: auto; margin-bottom: 22px; }
    h1 { font-size: 20px; margin: 0 0 10px; }
    p { color: #9aa3c7; font-size: 14px; line-height: 1.6; margin: 0 0 20px; }
    code {
      background: #1f2440;
      border: 1px solid #2c3355;
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 13px;
      color: #eef0fa;
    }
    .spinner {
      width: 34px; height: 34px;
      margin: 0 auto 20px;
      border: 3px solid #2c3355;
      border-top-color: #4361ee;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a.btn {
      display: inline-block;
      background: #4361ee;
      color: #fff;
      text-decoration: none;
      padding: 12px 22px;
      border-radius: 9px;
      font-size: 15px;
      min-height: 44px;
      line-height: 22px;
    }
    a.btn:hover { background: #5573f5; }
    .hidden { display: none; }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
</head>
<body>
  <div class="card">
    <img src="/IMG/omq-logo.png" alt="OMQ" class="logo" />

    <div id="loading">
      <div class="spinner"></div>
      <p>Taking you there…</p>
    </div>

    <div id="notFound" class="hidden">
      <h1>Link not found</h1>
      <p>
        There is no short link for <code id="codeShown"></code>.<br />
        It may have been mistyped or removed.
      </p>
      <a class="btn" href="/">Open OMQ QR Studio</a>
    </div>
  </div>

<script>
(function () {
  var code = decodeURIComponent(location.pathname)
    .replace(/^\/+|\/+$/g, '')
    .split('/')
    .pop()
    .toLowerCase();

  function notFound() {
    document.getElementById('loading').className = 'hidden';
    document.getElementById('codeShown').textContent = code || '(none)';
    document.getElementById('notFound').className = '';
    document.title = 'Link not found — OMQ';
  }

  if (!code) return notFound();

  /* Only http(s) destinations are allowed, so a bad entry can never
     turn into a javascript: or data: URL. */
  function isSafe(url) {
    try {
      var p = new URL(url, location.origin).protocol;
      return p === 'http:' || p === 'https:';
    } catch (e) {
      return false;
    }
  }

  fetch('/links.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
    .then(function (data) {
      var map = (data && data.links) || data || {};
      var entry = map[code];
      var url = typeof entry === 'string' ? entry : entry && entry.url;

      if (url && isSafe(url)) {
        location.replace(url);
      } else {
        notFound();
      }
    })
    .catch(notFound);
})();
</script>
</body>
</html>
