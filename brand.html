<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1220" />
  <meta name="robots" content="noindex" />
  <title>OMQ Brand Kit</title>
  <link rel="icon" href="IMG/omq-logo.png" />
  <link rel="apple-touch-icon" href="IMG/omq-logo.png" />
  <link rel="stylesheet" href="styles.css?v=18" />
</head>
<body>

  <header class="topbar">
    <a class="brand" href="dev.html">
      <img src="IMG/omq-logo.png" alt="OMQ" class="brand-logo" />
      <span class="brand-name">OMQ <b>Brand Kit</b></span>
    </a>
    <div class="topbar-right">
      <span class="account" id="authAccount"></span>
      <a class="topbar-link" href="dev.html">Dev Tools →</a>
    </div>
  </header>

  <main class="admin-wrap wide">


    <!-- ============ LIBRARY ============ -->
    <section class="panel" id="libraryPanel">
      <div class="admin-header">
        <h2>Brand Kit</h2>
        <button class="ghost" id="reloadBtn">Reload</button>
      </div>

      <div class="type-tabs" id="kindTabs">
        <button class="tab active" data-kind="logo">Logos</button>
        <button class="tab" data-kind="icon">Icons</button>
        <button class="tab" data-kind="colour">Colours</button>
        <button class="tab" data-kind="font">Fonts</button>
        <button class="tab" data-kind="template">Templates</button>
      </div>

      <label>
        <input type="search" id="searchInput" placeholder="Search by name or note"
               autocapitalize="off" autocorrect="off" spellcheck="false" />
      </label>

      <div class="asset-grid" id="assetGrid"></div>
      <p class="status" id="listStatus"></p>
    </section>

    <!-- ============ ADD ============ -->
    <section class="panel" id="addPanel">
      <h2>Add to <span id="addKindName">logos</span></h2>

      <!-- File-backed kinds -->
      <div id="fileForm">
        <label class="file-label">
          <input type="file" id="assetFile" />
          <span id="assetFileText">Choose a file</span>
        </label>

        <div class="field-row">
          <label>Name <span class="opt">optional</span>
            <input type="text" id="assetName" placeholder="Primary logo — dark" />
          </label>
          <label>Note <span class="opt">optional</span>
            <input type="text" id="assetNotes" placeholder="Use on light backgrounds" />
          </label>
        </div>

        <p class="muted-copy" id="allowedHint"></p>
      </div>

      <!-- Colours have no file -->
      <div class="hidden" id="colourForm">
        <div class="field-row">
          <label>Colour
            <input type="color" id="colourValue" value="#4361ee" />
          </label>
          <label>Hex
            <input type="text" id="colourHex" value="#4361EE"
                   autocapitalize="characters" autocorrect="off" spellcheck="false" />
          </label>
          <label>Name
            <input type="text" id="colourName" placeholder="OMQ Blue" />
          </label>
        </div>
        <label>Note <span class="opt">optional</span>
          <input type="text" id="colourNotes" placeholder="Primary accent" />
        </label>
      </div>

      <div class="actions">
        <button id="addBtn">Add</button>
      </div>
      <p class="status" id="addStatus"></p>
    </section>
  </main>

  <footer class="footer">
    OMQ Brand Kit · <a href="dev.html">Dev Tools</a> · <a href="index.html">Home</a>
  </footer>

  <script src="api.js?v=18"></script>
  <script src="brand.js?v=18"></script>
</body>
</html>
